# Keeps time-of-day reminders honest.
#
# Vercel's Hobby plan allows one cron a day, which cannot deliver a 4pm reminder
# at 4pm — so something has to hit /api/cron/reminders every ~15 minutes. This
# workflow is that something, living in the repo rather than in an external
# account that can quietly disable itself after a run of failures (which is
# exactly what happened during the database outage).
#
# Setup — two repository secrets, Settings → Secrets and variables → Actions:
#   CRON_SECRET  the same value as in Vercel's environment variables
#   APP_URL      the production origin, e.g. https://example.vercel.app
#
# This repo is PUBLIC. Never inline either value here.
#
# NOTE: GitHub only runs scheduled workflows from the repository's DEFAULT
# branch, and pauses them on repos with no activity for 60 days. Check the
# Schedules tab in the admin panel afterwards — it reports the last caller, so
# "github-actions" appearing there is the proof this is working.

name: Cron pinger

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and can run a few
    # minutes late under load; that is well within a reminder's tolerance.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# A slow run must never stack up behind the next tick.
concurrency:
  group: cron-pinger
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi
          # --fail-with-body so a 401 or 500 fails the run loudly AND shows the
          # response, instead of a green tick over a reminder that never fired.
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/reminders"
